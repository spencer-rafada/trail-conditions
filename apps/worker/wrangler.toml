# Cloudflare Worker: /api/* routes + cron triggers.
# Deploys are manual, never from a ship run. The database_id below is a
# placeholder for local development (wrangler dev / miniflare keep D1 state
# under .wrangler/state); the real id is filled in at manual deploy time.
name = "trail-conditions-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The Worker also serves the built site (apps/web/dist), so the site and
# /api/* share one address: the web app calls /api relative to itself.
# /api/* runs the Worker code; every other path is a static file, and
# unknown paths get index.html so /trails/<id> loads the app. Static file
# requests are free and don't count toward the Workers request limit.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "trail-conditions"
database_id = "00000000-0000-0000-0000-000000000000" # local-only placeholder

[triggers]
# Both strings must match SCORE_CRON / TUNE_CRON in src/crons.ts; the
# scheduled handler in src/index.ts dispatches on event.cron. 2 of the account's 5 triggers.
# 1. Score job: one chunk of Stage IV cells per run (spec §7.2/§7.3 cron 1).
# 2. Tune job (§7.3 cron 2), "nightly 03:00 MT": cron triggers are UTC, so
#    10:00 UTC = 03:00 MST; during daylight saving it runs at 04:00 MDT.
#    One fixed UTC hour, no DST code (ticket C-20261023-M6 decision 5).
crons = ["*/10 * * * *", "0 10 * * *"]
